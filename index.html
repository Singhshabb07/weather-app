<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather — right now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sky" id="sky">
    <div class="sun-moon" id="sunMoon"></div>
    <div class="clouds" id="clouds"></div>
    <div class="rain" id="rain"></div>
  </div>

  <main class="app">

    <form class="search" id="searchForm" autocomplete="off">
      <input type="text" id="cityInput" placeholder="Search a city…" aria-label="Search a city">
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      </button>
    </form>
    <button class="locate-btn" id="locateBtn" type="button">Use my location</button>

    <section class="status" id="status" hidden></section>

    <section class="now" id="now" hidden>
      <p class="place" id="place">—</p>
      <p class="datetime" id="datetime">—</p>

      <div class="hero">
        <div class="icon-wrap" id="iconWrap"></div>
        <p class="temp" id="temp">—°</p>
      </div>

      <p class="condition" id="condition">—</p>
      <p class="feels-like" id="feelsLike">—</p>

      <div class="stat-row">
        <div class="stat">
          <span class="stat-label">Wind</span>
          <span class="stat-value" id="wind">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Humidity</span>
          <span class="stat-value" id="humidity">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">UV index</span>
          <span class="stat-value" id="uv">—</span>
        </div>
      </div>
    </section>

    <section class="hourly" id="hourly" hidden>
      <h2>Next hours</h2>
      <div class="hourly-scroll" id="hourlyScroll"></div>
    </section>

    <section class="daily" id="daily" hidden>
      <h2>7-day outlook</h2>
      <div class="daily-list" id="dailyList"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
